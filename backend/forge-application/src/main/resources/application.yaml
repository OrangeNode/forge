# Orange Forge 应用基线配置。
#
# 约定：本文件是项目级常量与可调参数的唯一来源。新增可调参数时先在这里加带注释的配置项，
# 再在 Java 侧用 @ConfigurationProperties 或 @Value 读取，不在代码里写死取值。
# 连接信息与凭据一律来自环境变量；缺省值只用于本机开发，不得写入真实凭据。
# 协议不变式（HTTP 200、code/message/data/traceId 四字段、body.code 语义）不在这里配置。
server:
  port: ${FORGE_SERVER_PORT:8080}
  # 反向代理头处理：本机直连为 none；部署在 nginx 之后设为 native，由 Tomcat 从内网代理传入的
  # X-Forwarded-For 还原客户端地址，限流与登录日志按真实来源计算（见 deploy/compose.yaml）。
  forward-headers-strategy: ${FORGE_FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: orange-forge
  profiles:
    default: local

  # 数据源：dynamic-datasource 统一管理，strict 保证未声明的名称直接报错而不回退主库
  datasource:
    dynamic:
      strict: true
      primary: ${FORGE_PRIMARY_DATASOURCE:master}
      datasource:
        master:
          url: ${FORGE_MASTER_URL:jdbc:mysql://127.0.0.1:3306/orange_forge?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
          username: ${FORGE_MASTER_USERNAME:forge}
          password: ${FORGE_MASTER_PASSWORD:forge_app_2026}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            # 连接池上限与超时；本地开发用小池，部署时按实际并发调整
            maximum-pool-size: ${FORGE_DB_POOL_MAX:10}
            minimum-idle: ${FORGE_DB_POOL_MIN_IDLE:2}
            connection-timeout: 10000
            idle-timeout: 600000
            max-lifetime: 1800000
            pool-name: forge-master-pool

  # 迁移：只针对主库执行，目录按模块划分，见 db/migration/迁移说明.md
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # Redis：登录令牌、限流与必要缓存
  data:
    redis:
      host: ${FORGE_REDIS_HOST:127.0.0.1}
      port: ${FORGE_REDIS_PORT:6379}
      password: ${FORGE_REDIS_PASSWORD:redis_2026}
      database: ${FORGE_REDIS_DATABASE:0}
      timeout: 3s
      connect-timeout: 3s
      lettuce:
        pool:
          max-active: ${FORGE_REDIS_POOL_MAX_ACTIVE:16}
          max-idle: 8
          min-idle: 0
        shutdown-timeout: 1s

  # JSON：接口时间统一为带时区的 ISO 8601，UTC 以 Z 结尾
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  # 上传硬上限：管理员配置不得高于该值
  servlet:
    multipart:
      enabled: true
      # 需要容纳 App 安装包（2026-10-08 用户要求上传 APK），反向代理的请求体上限需同步调整
      max-file-size: ${FORGE_UPLOAD_MAX_FILE_SIZE:200MB}
      max-request-size: ${FORGE_UPLOAD_MAX_REQUEST_SIZE:210MB}

# MyBatis-Plus：自增主键与逻辑删除字段约定
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 项目自定义配置：所有可调常量集中在此
forge:
  # 数据源约定
  datasource:
    # 主库名称，必须与 spring.datasource.dynamic.datasource 下的键一致。
    # Flyway 以及其他只应作用于主库的能力都读取该值。
    primary-name: ${FORGE_PRIMARY_DATASOURCE:master}

  # 第二数据源：可选示例库。默认关闭，关闭时不注册，使用该名称会明确报错而不回退主库。
  # 启用后连接信息必须完整，凭据只从环境变量读取。
  secondary-datasource:
    enabled: ${FORGE_SECONDARY_ENABLED:false}
    name: ${FORGE_SECONDARY_NAME:secondary}
    url: ${FORGE_SECONDARY_URL:}
    username: ${FORGE_SECONDARY_USERNAME:}
    password: ${FORGE_SECONDARY_PASSWORD:}
    driver-class-name: ${FORGE_SECONDARY_DRIVER:com.mysql.cj.jdbc.Driver}
    pool-name: forge-secondary-pool
    # 连接池上限；按第二库的实际并发能力调整
    maximum-pool-size: ${FORGE_SECONDARY_POOL_MAX:5}
    minimum-idle: 1

  # MyBatis-Plus 分页插件：方言按部署数据库选择，避免写死
  mybatis-plus:
    db-type: ${FORGE_DB_TYPE:MYSQL}

  # 分页约定：分页入参的默认值、上限与排序白名单
  page:
    default-page-num: 1
    default-page-size: 20
    # 每页条数上限，超过即视为非法分页参数
    max-size: 100

  # 认证与权限：令牌有效期、登录失败限流、超级管理员角色与匿名放行路径
  security:
    # 令牌有效期秒数；首版不提供刷新令牌，到期必须重新登录
    token-ttl-seconds: ${FORGE_TOKEN_TTL_SECONDS:7200}
    # 同一用户名在统计窗口内允许的登录失败次数上限，超过返回 body.code=429
    login-max-attempts: ${FORGE_LOGIN_MAX_ATTEMPTS:5}
    # 登录失败计数的统计窗口秒数，每次失败重新计时
    login-attempt-window-seconds: ${FORGE_LOGIN_ATTEMPT_WINDOW_SECONDS:300}
    # 超级管理员角色代码；拥有该角色的管理员在权限解析时获得全部有效权限
    super-role-code: ${FORGE_SUPER_ROLE_CODE:super_admin}
    # 权限解析结果缓存秒数；缓存键包含全局权限版本，权限变更递增版本使全部缓存立即失效
    permission-cache-ttl-seconds: ${FORGE_PERMISSION_CACHE_TTL_SECONDS:300}
    # 匿名放行路径：只有登录接口、容器错误转发与接口文档，其余路径（含未知路径）一律要求认证。
    # 接口文档本身默认关闭（springdoc 配置见文件末尾），只在开发 profile 开启；
    # 需要在受保护环境保留文档时，把文档路径从本列表移除并改由令牌访问。
    permit-all-paths:
      - /api/admin/v1/auth/login
      - /error
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      # App 普通用户注册与登录（2026-10-07 恢复普通用户体系，2026-10-08 改为用户名登录）
      - /api/app/v1/member/auth/register
      - /api/app/v1/member/auth/login
      # 文件公开外链下载（如 App 安装包），只凭随机令牌访问，管理员可随时撤销
      - /api/public/v1/files/**
    # 仅以下 GET 接口匿名可用：App 启动配置与其引用的开屏/轮播图片。
    # 视频分类、列表、详情与播放线路自 2026-10-07 起必须普通用户登录，不再匿名。
    public-get-paths:
      - /api/app/v1/app/launch
      - /api/app/v1/app/images/{id}


  # 普通用户（App 用户）：令牌、验证码与发信。令牌与管理员令牌的 Redis 键、接口前缀完全分开。
  member:
    auth:
      # 令牌有效期秒数（默认 30 天），滑动续期：距上次续期超过间隔的请求重置为完整有效期
      token-ttl-seconds: ${FORGE_MEMBER_TOKEN_TTL_SECONDS:2592000}
      # 两次续期之间的最短间隔秒数，同时决定设备“最近活跃时间”的刷新频率
      renew-interval-seconds: ${FORGE_MEMBER_TOKEN_RENEW_INTERVAL_SECONDS:3600}
      # 普通用户接口前缀：该前缀下只识别普通用户令牌，其余路径只识别管理员令牌
      path-prefix: /api/app/
      # 以下三项只在 App 管理模块未装配时使用；装配后以“App 管理 → 功能开关”为准
      default-vip-required: true
      default-registration-open: false
      default-max-devices: 2
    # 注册：用户名注册不经过邮箱验证，同一来源地址每天最多注册的账号数
    register:
      ip-daily-limit: ${FORGE_MEMBER_REGISTER_IP_DAILY_LIMIT:10}
    # 每个用户保留并展示的最近观看记录条数（手机与电视共用），超出的旧记录在上报进度时删除
    history-keep: ${FORGE_MEMBER_HISTORY_KEEP:10}

  # App 管理：首页推荐行单行最多影片数
  app:
    section-max-items: ${FORGE_APP_SECTION_MAX_ITEMS:30}
    # 同一普通用户每天最多提交的意见反馈与播放报错条数
    feedback-daily-limit: ${FORGE_APP_FEEDBACK_DAILY_LIMIT:20}
    # 版本更新只接受该包名的 APK（手机与电视共用一个安装包）
    package-name: ${FORGE_APP_PACKAGE_NAME:cn.orangenode.orange_app}

  # 视频采集：单实例队列，所有可调参数集中于此。
  video:
    # 连接和整次请求超时秒数；失败不删除旧地址。
    connect-timeout-seconds: ${FORGE_VIDEO_CONNECT_TIMEOUT:10}
    request-timeout-seconds: ${FORGE_VIDEO_REQUEST_TIMEOUT:30}
    # 每页间隔毫秒、额外重试次数、正文大小上限字节。
    request-interval-millis: ${FORGE_VIDEO_REQUEST_INTERVAL:1000}
    retry-count: ${FORGE_VIDEO_RETRY_COUNT:2}
    max-response-bytes: ${FORGE_VIDEO_MAX_RESPONSE_BYTES:10485760}
    # 调度扫描秒数、清理间隔小时、终态日志保留天数。
    scan-interval-seconds: ${FORGE_VIDEO_SCAN_INTERVAL:5}
    cleanup-interval-hours: ${FORGE_VIDEO_CLEANUP_INTERVAL:24}
    log-retention-days: ${FORGE_VIDEO_LOG_RETENTION:30}
    # 每个连接地址的公开接口窗口秒数与最大请求数。
    app-rate-limit: ${FORGE_VIDEO_APP_RATE_LIMIT:120}
    app-rate-window-seconds: ${FORGE_VIDEO_APP_RATE_WINDOW:60}
    # 定时任务 cron 的统一调度时区，也是新增资源站解析源站时间的默认时区。
    default-zone: ${FORGE_VIDEO_DEFAULT_ZONE:Asia/Shanghai}
    worker-enabled: ${FORGE_VIDEO_WORKER_ENABLED:true}
    # 可选 HTTP CONNECT 代理；空值直接访问，不能通过资源站管理修改。
    proxy-url: ${FORGE_VIDEO_PROXY_URL:}
    # 使用明确的采集程序标识，避免源站拒绝 Java 默认标识。
    user-agent: ${FORGE_VIDEO_USER_AGENT:OrangeForge-VideoCollector/1.0}
    # 以下设置仅在首次初始化使用，之后通过后台修改。
    auto-publish: true
    default-match-fields: [name, year, category]
    default-update-fields: [name, category, year, area, language, director, actors, posterUrl, description, remarks, declaredTotal, ended]
    # 已存在或已删除来源不会被覆盖或恢复，不初始化运行任务。
    sources:
      - name: 量子资源站
        api-url: https://cj.lziapi.com/api.php/provide/vod/
      - name: 非凡资源站
        api-url: https://cj.ffzyapi.com/api.php/provide/vod/
      - name: 光速资源站
        api-url: https://api.guangsuapi.com/api.php/provide/vod/
      - name: 红牛资源站
        api-url: https://www.hongniuzy2.com/api.php/provide/vod/

  # 初始管理员引导：只在账号表为空时创建。
  # 默认凭据 admin / admin 只用于本机与演示（口令规则已按用户要求放宽到 5—64 位）；
  # 正式环境必须用 FORGE_INIT_ADMIN_USERNAME / FORGE_INIT_ADMIN_PASSWORD 覆盖并改成更强口令。
  system:
    bootstrap:
      enabled: ${FORGE_INIT_ADMIN_ENABLED:true}
      username: ${FORGE_INIT_ADMIN_USERNAME:admin}
      password: ${FORGE_INIT_ADMIN_PASSWORD:admin}
      display-name: ${FORGE_INIT_ADMIN_DISPLAY_NAME:初始管理员}

  # 文件与存储：本地根目录与临时目录来自环境，后台只能配置根目录下的相对目录；
  # 凭据加密主密钥只从环境读取，缺失时保存 S3 凭据会明确失败（本地存储不受影响）。
  file:
    local-root: ${FORGE_FILE_LOCAL_ROOT:./data/forge-files}
    temp-dir: ${FORGE_FILE_TEMP_DIR:./data/forge-tmp}
    # 临时文件保留小时数，超过后由维护任务清理
    temp-retention-hours: ${FORGE_FILE_TEMP_RETENTION_HOURS:24}
    # 凭据加密主密钥：Base64 编码的 32 字节值；未提供时无法保存对象存储凭据
    encryption-key: ${FORGE_FILE_ENCRYPTION_KEY:}
    # 未指定存储方案时使用的默认方案代码
    default-config-code: ${FORGE_FILE_DEFAULT_CONFIG_CODE:default}
    temp-cleanup-enabled: ${FORGE_FILE_TEMP_CLEANUP_ENABLED:true}
    # 临时文件清理任务执行间隔（小时）
    temp-cleanup-interval-hours: ${FORGE_FILE_TEMP_CLEANUP_INTERVAL_HOURS:6}

  # 审计：日志保留期限与清理任务；审计表只追加，清理只删除超过期限的记录
  audit:
    login-log-retention-days: ${FORGE_AUDIT_LOGIN_RETENTION_DAYS:90}
    operation-log-retention-days: ${FORGE_AUDIT_OPERATION_RETENTION_DAYS:180}
    cleanup-enabled: ${FORGE_AUDIT_CLEANUP_ENABLED:true}
    # 日志清理任务执行间隔（小时）
    cleanup-interval-hours: ${FORGE_AUDIT_CLEANUP_INTERVAL_HOURS:24}

  # Redis 约定：键前缀必须包含项目与环境，缓存必须有明确存活时间
  redis:
    # 键前缀，格式建议 项目:环境；同一 Redis 实例被多个项目或环境共用时防止键冲突
    key-prefix: ${FORGE_REDIS_KEY_PREFIX:forge:local}
    # 未显式指定 TTL 的缓存默认存活秒数
    default-ttl-seconds: ${FORGE_REDIS_DEFAULT_TTL_SECONDS:600}

  # Web 与追踪约定
  web:
    # 展示时区；数据库统一存 UTC，本值只影响需要按业务时区计算边界的场景
    display-zone: ${FORGE_DISPLAY_ZONE:UTC}
    # 是否写入追踪编号（响应头 + 请求属性）
    trace-enabled: true
    # 追踪编号响应头名称
    trace-header-name: X-Trace-Id

# API 文档：按接口规范生产默认关闭，开发 profile 显式开启（见 application-local.yaml）
springdoc:
  api-docs:
    enabled: ${FORGE_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${FORGE_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html

# 日志级别：按包名调整，避免为排查单个模块而改动代码
logging:
  level:
    # 视频地址和来源快照禁止通过 Mapper 调试参数日志输出。
    cn.orangenode.forge.video.mapper: ${FORGE_VIDEO_MAPPER_LOG_LEVEL:INFO}
    root: INFO
    cn.orangenode.forge: DEBUG
    # 配置装配信息（主库名称、追踪头名、迁移目录）用 INFO 输出，便于启动后核对配置是否生效
    cn.orangenode.forge.framework.config: INFO
    com.baomidou.dynamic.datasource: INFO
    com.baomidou.mybatisplus: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} : %msg%n"
