# 仅提供本地开发依赖，后端和前端在本机运行。
name: ${COMPOSE_PROJECT_NAME:-orange-forge}

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      TZ: UTC
      MYSQL_DATABASE: ${MYSQL_DATABASE:-orange_forge}
      MYSQL_USER: ${MYSQL_USER:-forge}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env.local 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env.local 中设置 MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 使用应用账号执行查询；TCP 连接避免初始化临时服务被误判为就绪。
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --connect-timeout=5 --batch --skip-column-names
          --execute="SELECT 1" | grep -qx '1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    environment:
      TZ: UTC
      # redis-cli 自动读取此变量，健康检查无需在命令行拼接密码。
      REDISCLI_AUTH: ${REDIS_PASSWORD:?请在 .env.local 中设置 REDIS_PASSWORD}
    # 保留官方 entrypoint；使用参数列表，密码不经过 shell 执行。
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请在 .env.local 中设置 REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'test "$$(redis-cli --no-auth-warning ping)" = "PONG"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MinIO：S3 兼容对象存储，仅用于文件存储的 S3 适配验收，按需启用。
  #
  # 启用方式：
  #   1. 把下面 minio 服务与文件末尾 minio-data 卷前面的注释去掉（不要改端口映射到 0.0.0.0）；
  #   2. 在 .env.local 中设置 MINIO_ROOT_USER 与 MINIO_ROOT_PASSWORD（凭据不进入版本库）；
  #   3. docker compose up -d minio，控制台 http://127.0.0.1:9001，S3 端点 http://127.0.0.1:9000；
  #   4. 后端在管理端「存储配置」里新增 s3 方案：endpoint=http://<主机>:9000、region 任意（如 us-east-1）、
  #      bucket 需先创建、path-style 打开；凭据加密主密钥来自 FORGE_FILE_ENCRYPTION_KEY。
  #
  # 说明：镜像标签固定为 latest 便于验收；生产或长期环境请改为具体的 RELEASE.* 标签并记录来源。
  # minio:
  #   image: minio/minio:latest
  #   restart: unless-stopped
  #   command: ["server", "/data", "--console-address", ":9001"]
  #   environment:
  #     TZ: UTC
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env.local 中设置 MINIO_ROOT_USER}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env.local 中设置 MINIO_ROOT_PASSWORD}
  #   ports:
  #     - "127.0.0.1:${MINIO_PORT:-9000}:9000"
  #     - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
  #   volumes:
  #     - minio-data:/data
  #   healthcheck:
  #     # 使用镜像自带的 mc 客户端探测本机实例；失败重试由 compose 负责。
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 6
  #     start_period: 20s

# 卷名由 Compose 项目名隔离；停止或重建容器不删除卷。
volumes:
  mysql-data:
  redis-data:
  # 启用 MinIO 时同时取消下面一行的注释
  # minio-data:
