# 仅提供本地开发依赖，后端和两个前端在本机运行。
name: ${COMPOSE_PROJECT_NAME:-orange-forge}

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      TZ: UTC
      MYSQL_DATABASE: ${MYSQL_DATABASE:-orange_forge}
      MYSQL_USER: ${MYSQL_USER:-forge}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env.local 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env.local 中设置 MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 使用应用账号执行查询；TCP 连接避免初始化临时服务被误判为就绪。
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --connect-timeout=5 --batch --skip-column-names
          --execute="SELECT 1" | grep -qx '1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    environment:
      TZ: UTC
      # redis-cli 自动读取此变量，健康检查无需在命令行拼接密码。
      REDISCLI_AUTH: ${REDIS_PASSWORD:?请在 .env.local 中设置 REDIS_PASSWORD}
    # 保留官方 entrypoint；使用参数列表，密码不经过 shell 执行。
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请在 .env.local 中设置 REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'test "$$(redis-cli --no-auth-warning ping)" = "PONG"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# 卷名由 Compose 项目名隔离；停止或重建容器不删除卷。
volumes:
  mysql-data:
  redis-data:
