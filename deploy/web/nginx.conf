# 管理端静态页面 + 接口反向代理，按用途分成三个入口（2026-10-09 安全加固）：
#   8081 后台入口：管理端页面、/api/admin/、/api/public/（后台复制的公开外链用这个地址）
#   8082 App 入口：/api/app/、/api/public/（接口与安装包下载），不提供后台页面
#   80   旧入口：与 App 入口相同，只为 1.0.2 及更早的 App 过渡（这些版本把 80 端口写死在安装包里）
# 容器内端口固定，对外端口由 compose.yaml 的 ADMIN_PORT、APP_PORT、LEGACY_HTTP_PORT 决定。

# 按来源地址限流：普通接口每秒 20 次（允许短时突发），登录与注册每分钟 10 次，验证码图片每分钟 30 次。
# 验证码单独计数，刷新图片不会占用登录次数。
limit_req_zone $binary_remote_addr zone=forge_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=forge_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=forge_captcha:10m rate=30r/m;
# 公开下载按来源地址限制并发连接数。
limit_conn_zone $binary_remote_addr zone=forge_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server_tokens off;

# 反向代理公共设置。
proxy_http_version 1.1;
proxy_set_header Host $host;
# 覆盖而不是追加客户端传入的 X-Forwarded-For，防止伪造来源地址。
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 10s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;

# 后台入口
server {
    listen 8081;
    server_name _;

    include /etc/nginx/snippets/rate-limited.conf;

    # 与后端 spring.servlet.multipart.max-request-size（210MB，容纳 App 安装包）一致，只有后台需要上传。
    client_max_body_size 210m;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/admin/v1/auth/login {
        limit_req zone=forge_auth burst=10 nodelay;
        proxy_pass http://backend:8080;
    }

    location = /api/admin/v1/auth/captcha {
        limit_req zone=forge_captcha burst=10 nodelay;
        proxy_pass http://backend:8080;
    }

    location /api/admin/ {
        limit_req zone=forge_api burst=60 nodelay;
        proxy_pass http://backend:8080;
    }

    location /api/public/ {
        limit_conn forge_conn 4;
        proxy_pass http://backend:8080;
    }

    # 开屏与轮播图片（本身匿名公开），后台列表与表单预览需要在后台入口读取。
    location ^~ /api/app/v1/app/images/ {
        limit_req zone=forge_api burst=60 nodelay;
        proxy_pass http://backend:8080;
    }

    # 其他接口前缀（App 接口、接口文档等）不在后台入口提供。
    location /api/ {
        return 404;
    }

    # 带哈希的构建资源长期缓存；入口页不缓存，保证更新后立即生效。
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 30d;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

# App 入口与旧入口：只转发 App 接口与公开下载，没有后台页面。
server {
    listen 8082;
    listen 80;
    server_name _;

    include /etc/nginx/snippets/rate-limited.conf;

    # App 接口没有文件上传，请求体保持很小。
    client_max_body_size 1m;

    location = /api/app/v1/member/auth/login {
        limit_req zone=forge_auth burst=10 nodelay;
        proxy_pass http://backend:8080;
    }

    location = /api/app/v1/member/auth/register {
        limit_req zone=forge_auth burst=5 nodelay;
        proxy_pass http://backend:8080;
    }

    location /api/app/ {
        limit_req zone=forge_api burst=60 nodelay;
        proxy_pass http://backend:8080;
    }

    location /api/public/ {
        limit_conn forge_conn 4;
        proxy_pass http://backend:8080;
    }

    location / {
        return 404;
    }
}
