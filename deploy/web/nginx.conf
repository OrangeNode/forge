# 管理端静态页面 + 接口反向代理（nginx 模板：镜像启动时用环境变量替换 ${FORGE_ADMIN_HOST}、${FORGE_API_HOST}，
# 只替换 FORGE_ 开头的变量，nginx 自身的 $host 等变量不受影响，见 Dockerfile 的 NGINX_ENVSUBST_FILTER）。
# 入口划分（2026-10-09 安全加固，2026-10-12 增加域名入口）：
#   8081 后台入口：管理端页面、/api/admin/、/api/public/（后台复制的公开外链用这个地址）
#   8082 App 入口：/api/app/、/api/public/（接口与安装包下载），不提供后台页面
#   80   域名入口：按 Host 分流，后台域名同 8081，App 接口域名同 8082；用 IP 或其他域名访问直接断开连接
# 容器内端口固定，对外端口与域名由 compose.yaml 的 ADMIN_PORT、APP_PORT、HTTP_PORT、ADMIN_HOST、API_HOST 决定。
# 两类站点的具体 location 在 snippets/admin-site.conf、snippets/app-site.conf，高位端口与域名入口共用。

# 按来源地址限流：普通接口每秒 20 次（允许短时突发），登录与注册每分钟 10 次，验证码图片每分钟 30 次。
# 验证码单独计数，刷新图片不会占用登录次数。
limit_req_zone $binary_remote_addr zone=forge_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=forge_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=forge_captcha:10m rate=30r/m;
# 公开下载按来源地址限制并发连接数。
limit_conn_zone $binary_remote_addr zone=forge_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server_tokens off;

# 反向代理公共设置。
proxy_http_version 1.1;
proxy_set_header Host $host;
# 覆盖而不是追加客户端传入的 X-Forwarded-For，防止伪造来源地址。
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 10s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;

# 后台入口（高位端口）
server {
    listen 8081;
    server_name _;
    include /etc/nginx/snippets/admin-site.conf;
}

# App 入口（高位端口）
server {
    listen 8082;
    server_name _;
    include /etc/nginx/snippets/app-site.conf;
}

# 80 端口：未匹配域名（直接用 IP、其他子域名）不返回任何内容，避免泛解析把站点暴露在任意子域名下。
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# 80 端口：后台域名
server {
    listen 80;
    server_name ${FORGE_ADMIN_HOST};
    include /etc/nginx/snippets/admin-site.conf;
}

# 80 端口：App 接口域名
server {
    listen 80;
    server_name ${FORGE_API_HOST};
    include /etc/nginx/snippets/app-site.conf;
}
