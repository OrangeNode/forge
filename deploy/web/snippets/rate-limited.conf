# 触发 nginx 限流时按项目统一协议返回：HTTP 200 + body.code=429（四字段），前端与 App 按 body.code 提示，
# 不会因为 HTTP 429 被当成网络错误。traceId 使用 nginx 的请求编号，便于在 web 日志中查找。
error_page 429 = @forge_rate_limited;

location @forge_rate_limited {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"code":429,"message":"请求过于频繁，请稍后再试","data":null,"traceId":"$request_id"}';
}
