# 管理端页面的安全响应头。nginx 的 add_header 不会从外层继承到写了 add_header 的 location，
# 因此单独成文件，在每个返回页面的 location 中 include。
# 后台需要显示资源站的外链海报、播放外部 m3u8（hls.js 使用 blob 与 Worker），因此图片、媒体与连接放开 http/https；
# 脚本只允许同源，页面不允许被其他站点嵌入。naive-ui 运行时注入样式，style-src 需要 'unsafe-inline'。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' blob: http: https:; connect-src 'self' http: https:; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
