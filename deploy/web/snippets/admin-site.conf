# 后台站点内容：管理端页面、/api/admin/、/api/public/（后台复制的公开外链用这个地址）。
# 由 nginx.conf 中的后台高位端口与后台域名两个 server 共同 include，保证两个入口行为一致。

include /etc/nginx/snippets/rate-limited.conf;

# 与后端 spring.servlet.multipart.max-request-size（210MB，容纳 App 安装包）一致，只有后台需要上传。
client_max_body_size 210m;

root /usr/share/nginx/html;
index index.html;

location = /api/admin/v1/auth/login {
    limit_req zone=forge_auth burst=10 nodelay;
    proxy_pass http://backend:8080;
}

location = /api/admin/v1/auth/captcha {
    limit_req zone=forge_captcha burst=10 nodelay;
    proxy_pass http://backend:8080;
}

location /api/admin/ {
    limit_req zone=forge_api burst=60 nodelay;
    proxy_pass http://backend:8080;
}

location /api/public/ {
    limit_conn forge_conn 4;
    proxy_pass http://backend:8080;
}

# 开屏与轮播图片（本身匿名公开），后台列表与表单预览需要在后台入口读取。
location ^~ /api/app/v1/app/images/ {
    limit_req zone=forge_api burst=60 nodelay;
    proxy_pass http://backend:8080;
}

# 其他接口前缀（App 接口、接口文档等）不在后台入口提供。
location /api/ {
    return 404;
}

# 带哈希的构建资源长期缓存；入口页不缓存，保证更新后立即生效。
location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable" always;
    expires 30d;
    try_files $uri =404;
}

location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}
