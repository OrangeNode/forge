# 测试服务器部署：MySQL、Redis、后端、管理端（nginx）一套 Compose。
# 只有 web 服务的端口对外开放；App 与管理端都经 nginx 访问，/api 由 nginx 反向代理到后端。
# 凭据全部来自同目录 .env（模板 .env.example，服务器上 chmod 600，不进入版本库）。
# 部署步骤见 docs/部署指南.md。
name: ${COMPOSE_PROJECT_NAME:-orange-forge}

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      TZ: UTC
      MYSQL_DATABASE: ${MYSQL_DATABASE:-orange_forge}
      MYSQL_USER: ${MYSQL_USER:-forge}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --connect-timeout=5 --batch --skip-column-names
          --execute="SELECT 1" | grep -qx '1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    environment:
      TZ: UTC
      REDISCLI_AUTH: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'test "$$(redis-cli --no-auth-warning ping)" = "PONG"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    image: orange-forge/backend:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: UTC
      # 只使用 application.yaml 基线配置，不启用开发 profile（接口文档保持关闭）。
      SPRING_PROFILES_ACTIVE: server
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx768m}
      # 位于 nginx 之后：由容器内网代理传入的 X-Forwarded-For 还原真实来源地址（限流、登录日志）。
      FORGE_FORWARD_HEADERS_STRATEGY: native
      # 基线把项目包日志设为 DEBUG（会输出 SQL 参数）；服务器上降为 INFO，排查时可临时调回。
      LOGGING_LEVEL_CN_ORANGENODE_FORGE: ${FORGE_LOG_LEVEL:-INFO}
      FORGE_MASTER_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-orange_forge}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      FORGE_MASTER_USERNAME: ${MYSQL_USER:-forge}
      FORGE_MASTER_PASSWORD: ${MYSQL_PASSWORD}
      FORGE_REDIS_HOST: redis
      FORGE_REDIS_PASSWORD: ${REDIS_PASSWORD}
      FORGE_REDIS_KEY_PREFIX: ${FORGE_REDIS_KEY_PREFIX:-forge:server}
      FORGE_FILE_LOCAL_ROOT: /data/forge-files
      FORGE_FILE_TEMP_DIR: /data/forge-tmp
      FORGE_FILE_ENCRYPTION_KEY: ${FORGE_FILE_ENCRYPTION_KEY:?请在 .env 中设置 FORGE_FILE_ENCRYPTION_KEY}
      FORGE_INIT_ADMIN_USERNAME: ${FORGE_INIT_ADMIN_USERNAME:-admin}
      FORGE_INIT_ADMIN_PASSWORD: ${FORGE_INIT_ADMIN_PASSWORD:?请在 .env 中设置 FORGE_INIT_ADMIN_PASSWORD}
    volumes:
      - forge-files:/data
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  web:
    build: ./web
    image: orange-forge/web:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

# 卷名由 Compose 项目名隔离；重建容器不删除卷。
volumes:
  mysql-data:
  redis-data:
  forge-files:
